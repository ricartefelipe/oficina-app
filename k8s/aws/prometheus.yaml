apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: oficina
  labels:
    app.kubernetes.io/name: prometheus
data:
  alerts.yml: |
    groups:
      - name: oficina-app
        rules:
          - alert: OficinaAppDown
            expr: up{job="oficina-app"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "oficina-app indisponivel"
              description: "Prometheus nao consegue coletar metricas da API ha mais de 2 minutos."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    rule_files:
      - /etc/prometheus/rules/alerts.yml
    scrape_configs:
      - job_name: oficina-app
        metrics_path: /api/actuator/prometheus
        static_configs:
          - targets: ["oficina-app.oficina.svc.cluster.local:80"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: oficina
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: oficina
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
