# Copie para secret.yaml, preencha valores reais e aplique:
#   kubectl apply -f k8s/secret.yaml
# Não commite secret.yaml com credenciais.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-app-secret
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://postgres.oficina.svc.cluster.local:5432/oficina"
  DB_USER: "oficina"
  DB_PASS: "altere-esta-senha"
