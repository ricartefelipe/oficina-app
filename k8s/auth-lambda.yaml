apiVersion: v1
kind: Service
metadata:
  name: oficina-auth
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-auth
    app.kubernetes.io/component: auth-lambda
spec:
  type: ClusterIP
  selector:
    app: oficina-auth
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-auth
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-auth
    app.kubernetes.io/component: auth-lambda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-auth
  template:
    metadata:
      labels:
        app: oficina-auth
    spec:
      containers:
        - name: auth
          image: oficina-auth:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secret
                  key: JWT_CPF_SECRET
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: oficina-app-config
                  key: JWT_CPF_ISSUER
            - name: PGHOST
              value: postgres.oficina.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: oficina
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secret
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-app-secret
                  key: DB_PASS
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
