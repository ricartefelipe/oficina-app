<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <title>Event Storming — visão por contextos</title>
  <desc>Quadro simplificado: bounded contexts e integrações (Fase 1/2).</desc>
  <rect width="800" height="480" fill="#fafafa"/>
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">Event Storming (resumo) — Oficina</text>
  <rect x="40" y="70" width="200" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="140" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Cadastros</text>
  <text x="140" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Cliente, Veículo</text>
  <rect x="300" y="70" width="200" height="120" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="400" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Catálogo</text>
  <text x="400" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Serviços, Peças / estoque</text>
  <rect x="560" y="70" width="200" height="120" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="660" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Ordem de Serviço</text>
  <text x="660" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">OS, orçamento, status</text>
  <rect x="120" y="240" width="560" height="100" rx="6" fill="#fce4ec" stroke="#c2185b"/>
  <text x="400" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Integrações</text>
  <text x="400" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Keycloak (JWT) · E-mail (SMTP) · API pública (tracking)</text>
  <text x="400" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555">Ver também event-storming.md e diagramas.md (Mermaid)</text>
</svg>
