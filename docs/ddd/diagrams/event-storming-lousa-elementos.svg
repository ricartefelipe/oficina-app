<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <title>Event Storming  lousa com elementos (Fase 1)</title>
  <desc>Atores, comandos, agregado, eventos, políticas e read models no fluxo da OS.</desc>
  <rect width="920" height="520" fill="#f5f5f5"/>
  <text x="460" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold">Event Storming  elementos (oficina)</text>
  <text x="460" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#444">Legenda: laranja = comando · amarelo = evento · roxo = política · verde = read model · azul = agregado</text>
  <text x="24" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Atores</text>
  <rect x="24" y="96" width="100" height="36" rx="4" fill="#e1bee7" stroke="#7b1fa2"/>
  <text x="74" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Admin</text>
  <rect x="132" y="96" width="100" height="36" rx="4" fill="#e1bee7" stroke="#7b1fa2"/>
  <text x="182" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Cliente</text>
  <text x="24" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Comandos [C]</text>
  <rect x="24" y="176" width="130" height="32" rx="4" fill="#ffcc80" stroke="#ef6c00"/>
  <text x="89" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">CriarOrdemServico</text>
  <rect x="164" y="176" width="130" height="32" rx="4" fill="#ffcc80" stroke="#ef6c00"/>
  <text x="229" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">AprovarOrcamento</text>
  <rect x="304" y="176" width="130" height="32" rx="4" fill="#ffcc80" stroke="#ef6c00"/>
  <text x="369" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">FinalizarExecucao</text>
  <text x="24" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Agregado [A]</text>
  <rect x="24" y="248" width="200" height="44" rx="4" fill="#90caf9" stroke="#1565c0"/>
  <text x="124" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">OrdemServico</text>
  <text x="24" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Eventos [E]</text>
  <rect x="24" y="328" width="150" height="30" rx="4" fill="#fff59d" stroke="#f9a825"/>
  <text x="99" y="347" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">OrdemServicoCriada</text>
  <rect x="184" y="328" width="150" height="30" rx="4" fill="#fff59d" stroke="#f9a825"/>
  <text x="259" y="347" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">OrcamentoAprovado</text>
  <rect x="344" y="328" width="170" height="30" rx="4" fill="#fff59d" stroke="#f9a825"/>
  <text x="429" y="347" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">StatusAlterado(...)</text>
  <text x="24" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Políticas [P]</text>
  <rect x="24" y="400" width="200" height="32" rx="4" fill="#ce93d8" stroke="#6a1b9a"/>
  <text x="124" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">BaixarEstoqueDasPecasDaOS</text>
  <rect x="236" y="400" width="200" height="32" rx="4" fill="#ce93d8" stroke="#6a1b9a"/>
  <text x="336" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">NotificarClienteSobreOrcamento</text>
  <text x="500" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Read models [R]</text>
  <rect x="500" y="128" width="180" height="36" rx="4" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="590" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">ConsultaPublicaPorTracking</text>
  <rect x="688" y="128" width="200" height="36" rx="4" fill="#a5d6a7" stroke="#2e7d32"/>
  <text x="788" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10">ListagemAdminOS / Metricas</text>
  <text x="500" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Fluxos alternativos</text>
  <rect x="500" y="208" width="400" height="72" rx="4" fill="#eeeeee" stroke="#757575"/>
  <text x="510" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="10">Recusa externa ao orçamento ’ CANCELADA · estoque insuficiente na aprovação ’ erro 409</text>
  <text x="510" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="10">Integração externa: sistema de notificação (e-mail) e resposta de orçamento (webhook)</text>
  <text x="460" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Replicar no Miro: sticky notes por cor + setas comando ’ agregado ’ evento ’ política</text>
</svg>
